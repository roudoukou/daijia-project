version: '3'
services:
  rabbitmq:
    image: rabbitmq:3.12.0-management
    container_name: rabbitmq-daijia
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: 123456
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - /data/rabbitmq:/var/lib/rabbitmq

  #  http://192.168.1.100:8848/nacos
  nacos:
    image: nacos/nacos-server:v2.4.0
    container_name: nacos-daijia
    environment:
      - MODE=standalone
    volumes:
      - /data/nacos/standalone-logs/:/home/nacos/logs
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  mysql:
    container_name: mysql-daijia
    restart: always
    image: mysql:8.0.30
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      TZ: Asia/Shanghai
    volumes:
      - /data/mysql/datadir:/var/lib/mysql
      - /data/mysql/config/my.cnf:/etc/mysql/my.cnf
#      - /data/mysql/init:/docker-entrypoint-initdb.d
      # 挂载初始化脚本，当数据库容器启动时，该目录下的所有脚本会被自动执行。这些脚本通常包含数据库初始化所需的命令，如创建数据库、表、用户，以及设置权限等。
    ports:
      - "6033:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7
    container_name: redis-daijia
    command: redis-server /etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - /data/redis/data:/data
      - /data/redis/conf/redis.conf:/etc/redis/redis.conf
    restart: always

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z.fips
    container_name: minio-daijia
    hostname: minio
    environment:
      - MINIO_ROOT_USER=minioadmin # MINIO_ROOT_USER length should be at least 3
      - MINIO_ROOT_PASSWORD=minioadmin # and MINIO_ROOT_PASSWORD length at least 8 characters
    ports:
      - 9000:9000
      - 9001:9001
    command: server /data --console-address ":9001"
    restart: always
    volumes:
      - /data/minio/data:/data

# http://192.168.1.100:18080/xxl-job-admin    admin 123456
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.2
    restart: always
    hostname: admin
    container_name: xxl-job-daijia
    ports:
      - 18080:8080
    volumes:
      - "/data/xxl-job/log:/data/applogs"
    environment:
      PARAMS: '
        --spring.datasource.url=jdbc:mysql://192.168.1.100:6033/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
        --spring.datasource.username=root
        --spring.datasource.password=123456'
    depends_on:
      mysql:
        condition: service_healthy

  xxl-job-executor:
    image: robotjerry/xxl-job-executor:latest
    restart: always
    hostname: admin
    container_name: xxl-job-daijia
    ports:
      - 18080:8080
    volumes:
      - "/data/xxl-job/log:/data/applogs"
    environment:
      PARAMS: '
        --spring.datasource.url=jdbc:mysql://192.168.1.100:6033/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
        --spring.datasource.username=root
        --spring.datasource.password=123456'
    depends_on:
      mysql:
        condition: service_healthy